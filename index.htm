<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超昂大戦 毎日おみくじ（豪華演出版）</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            text-align: center;
            background-color: #fce4ec; /* サイト背景色 */
            background-image: url('背景画像のファイル名があればここに'); /* 背景画像を入れる場合 */
            background-size: cover;
            background-position: center;
            color: #333;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            z-index: 30;
        }
        h1 { color: #e91e63; font-size: 24px; }
        
        /* シルエット画像の初期設定 */
        .dynamo-img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin: 20px auto;
            display: block;
            border-radius: 50%; /* 画像を丸く見せる場合 */
        }

        /* 演出開始時のアニメーション（回転 ＋ 徐々にピンク発光） */
        .anim-active {
            animation: 
                spin 1s linear infinite, /* 1秒で1回転を繰り返す */
                glowPink 3s ease-in-out forwards; /* 3秒かけてピンクに発光 */
        }

        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); } /* 少し大きくなる */
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes glowPink {
            0% { filter: drop-shadow(0 0 0px transparent); }
            50% { filter: drop-shadow(0 0 20px #ff007f); }
            100% { filter: drop-shadow(0 0 50px #ff007f) drop-shadow(0 0 80px #ff1493); }
        }

        .btn {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(233, 30, 99, 0.4);
        }
        .btn:hover { background-color: #c2185b; }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; }
        
        #result-area { display: none; margin-top: 25px; }
        
        .character-img {
            max-width: 100%;
            height: auto;
            max-height: 350px;
            border-radius: 10px;
            margin: 0 auto 15px;
            display: block;
            object-fit: contain;
        }
        
        .char-name {
            font-size: 24px;
            color: #e91e63;
            margin-bottom: 15px;
            border-bottom: 2px solid #fce4ec;
            display: inline-block;
            padding-bottom: 5px;
        }
        .fortune-text {
            font-size: 16px;
            line-height: 1.8;
            text-align: left;
            padding: 0 10px;
            font-weight: bold;
        }
        .x-share-btn {
            display: inline-block;
            background-color: #000;
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            margin-top: 25px;
            font-weight: bold;
        }
        .message { margin-top: 15px; font-weight: bold; color: #d32f2f; }

        /* 蝶々エフェクト */
        .butterfly {
            position: fixed;
            font-size: 35px;
            filter: drop-shadow(0 0 10px #ff007f) drop-shadow(0 0 20px #ff69b4); /* ピンク系の光に変更 */
            opacity: 0;
            pointer-events: none;
            z-index: 40;
        }
        @keyframes flutter {
            0% { transform: translateY(100vh) translateX(0) scale(0.5) rotate(-20deg); opacity: 0; }
            10% { opacity: 1; }
            50% { transform: translateY(50vh) translateX(40px) scale(1) rotate(10deg); }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(-40px) scale(1.5) rotate(-30deg); opacity: 0; }
        }

        /* 画面全体のフラッシュ光 */
        .flash {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: white;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity 0.8s ease-out; /* 光る速度を少し長めに調整 */
        }
    </style>
</head>
<body>

<div id="flash" class="flash"></div>

<div class="container">
    <h1>超昂大戦 毎日おみくじ</h1>
    
    <!-- シルエット画像エリア -->
    <div id="waiting-area">
        <img id="dynamo-img" class="dynamo-img" src="ドキドキダイナモシルエット.webp" alt="ダイナモシルエット">
        <button id="draw-btn" class="btn">おみくじを引く</button>
        <div id="limit-message" class="message"></div>
    </div>

    <!-- 結果エリア -->
    <div id="result-area">
        <img id="char-img" class="character-img" src="" alt="キャラクター画像" style="display:none;">
        <h2 id="char-name" class="char-name"></h2>
        <p id="fortune-text" class="fortune-text"></p>
        <a id="x-share" class="x-share-btn" href="#" target="_blank">𝕏 で結果をシェアする</a>
    </div>
</div>

<script>
    const characters = [
        { name: "エスカ・ルビー", text: "今日はあなたの情熱が燃え上がる最高の一日！どんな困難もルビーのように熱く打ち砕けます。積極的に行動すれば、周囲を巻き込む大成功に繋がりますよ！", img: "ruby.png" },
        { name: "エスカ・トパーズ", text: "とても穏やかで平和な一日になるでしょう。あなたの優しさと包容力が誰かの大きな支えになります。誰かに優しくした分、あなたにも素敵な幸運が返ってきますよ。", img: "sapphire.png" },
        { name: "エスカ・サファイア", text: "今日は頭脳が冴え渡る素晴らしい一日。サファイアのように冷静な判断ができ、難しい問題もスルスルと解けてしまうはず。新しい知識を吸収するのにも最適です！", img: "topaz.png" },
        { name: "エスカ・アメイズ", text: "ワクワクするような嬉しいサプライズが待っている予感！アメイズのように遊び心を持って過ごすことで、日常が魔法のように楽しいものに変わりますよ。", img: "amaze.png" },
        { name: "閃忍イノリ", text: "類まれなる集中力を発揮できる日。まるで影のようにスムーズに、どんな任務も完璧にこなせます。あなたの真面目な努力が大きな成果を生みます！", img: "inori.png" },
        { name: "閃忍ライカ", text: "スピード勝負ならあなたの独壇場！稲妻のごとく素早く、爽快に物事が進んでいきます。直感を信じて即行動することで、最高の結果が手に入るでしょう！", img: "leica.png" },
        { name: "レガリアの神騎ユリエル", text: "正義と光の加護があなたに降り注いでいます。これまでの誠実な頑張りが、最高の形で報われる一日。自信を持って堂々と前へ進んでください！", img: "uriel.png" },
        { name: "レガリアの神騎マヤエル", text: "心身ともに深い癒しを得られる一日。焦らずリラックスして過ごすことで、内なるエネルギーが満ち溢れてきます。あなたの笑顔が周囲を温かく照らすでしょう。", img: "Mayael.png" },
        { name: "レガリアの神騎メガエル", text: "圧倒的なパワーがみなぎっています！目の前に立ち塞がる壁も、今日のあなたなら豪快に吹き飛ばせるはず。どんな挑戦もポジティブに楽しんでいきましょう！", img: "mega-l.png" },
        { name: "ユーノ", text: "オールグリーン！今日のあなたは完璧なナビゲートに導かれています。計画通りに全てが順調に進み、トラブルとは無縁の一日。安心してやりたい事を楽しんで！", img: "yuno.png" }
    ];

    const drawBtn = document.getElementById('draw-btn');
    const dynamoImg = document.getElementById('dynamo-img');
    const waitingArea = document.getElementById('waiting-area');
    const resultArea = document.getElementById('result-area');
    const limitMessage = document.getElementById('limit-message');
    const flashScreen = document.getElementById('flash');

    drawBtn.addEventListener('click', () => {
        // ボタンを無効化し、メッセージを変更
        drawBtn.disabled = true; 
        limitMessage.textContent = "運命が交差しています...";

        // 1. シルエット画像を回転＆発光させるCSSクラスを追加
        dynamoImg.classList.add('anim-active');

        // 2. 蝶々を生成して飛ばす
        createButterflies(25);

        // 3. 3.2秒後に画面全体を白くフラッシュ（光に包まれる）
        setTimeout(() => {
            flashScreen.style.opacity = '1';
        }, 3200);

        // 4. 4.0秒後にフラッシュを消し、シルエットを消して結果を表示
        setTimeout(() => {
            flashScreen.style.opacity = '0'; // 光が晴れる
            waitingArea.style.display = 'none'; // シルエットとボタンを非表示
            
            // ランダムに結果を取得
            const result = characters[Math.floor(Math.random() * characters.length)];
            
            // 結果を反映
            document.getElementById('char-name').textContent = result.name;
            document.getElementById('fortune-text').textContent = result.text;
            if(result.img !== "") {
                document.getElementById('char-img').src = result.img;
                document.getElementById('char-img').style.display = 'block';
            }

            // Xシェア用リンク設定
            const siteUrl = encodeURIComponent(window.location.href);
            const shareText = encodeURIComponent(`今日のキャラクターは【${result.name}】でした！\n「${result.text}」\n\n#超昂大戦おみくじ #超昂大戦\n`);
            document.getElementById('x-share').href = `https://twitter.com/intent/tweet?text=${shareText}&url=${siteUrl}`;

            // 結果エリアを表示
            resultArea.style.display = 'block';

            // 演出が終わった蝶々を削除
            document.querySelectorAll('.butterfly').forEach(b => b.remove());

        }, 4000);
    });

    // 蝶々を生成する関数
    function createButterflies(count) {
        for (let i = 0; i < count; i++) {
            const butterfly = document.createElement('div');
            butterfly.classList.add('butterfly');
            
            // 蝶々の画像がある場合はここを変更（今は絵文字）
            butterfly.textContent = '🦋'; 

            butterfly.style.left = (Math.random() * 90) + 'vw';
            
            const duration = 2.5 + Math.random() * 2; // 2.5秒〜4.5秒
            const delay = Math.random() * 1.5; // 0秒〜1.5秒遅れて発生
            butterfly.style.animation = `flutter ${duration}s ease-in ${delay}s forwards`;
            butterfly.style.transform = `scale(${0.6 + Math.random() * 1.0})`;

            document.body.appendChild(butterfly);
        }
    }
</script>

</body>
</html>
